<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" font-family="Georgia, serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf8a"/>
      <stop offset="0.5" stop-color="#c2a14e"/>
      <stop offset="1" stop-color="#9a7c2e"/>
    </linearGradient>
    <linearGradient id="goldband" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8be78"/>
      <stop offset="1" stop-color="#a4842f"/>
    </linearGradient>
    <linearGradient id="gules" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2733"/>
      <stop offset="1" stop-color="#6f1c27"/>
    </linearGradient>
  </defs>

  <!-- Mantling flourishes behind shield -->
  <g fill="none" stroke="url(#goldband)" stroke-width="3" opacity="0.85" stroke-linecap="round">
    <path d="M205 250 C120 230 95 320 140 360 C90 380 110 460 165 455"/>
    <path d="M395 250 C480 230 505 320 460 360 C510 380 490 460 435 455"/>
    <path d="M210 245 C150 210 150 165 190 150"/>
    <path d="M390 245 C450 210 450 165 410 150"/>
  </g>

  <!-- Coronet -->
  <g>
    <path d="M222 196 L378 196 L372 156 L300 168 L228 156 Z" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
    <rect x="216" y="196" width="168" height="16" rx="3" fill="url(#goldband)" stroke="#7a611f" stroke-width="2"/>
    <circle cx="300" cy="150" r="9" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
    <circle cx="240" cy="158" r="7" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
    <circle cx="360" cy="158" r="7" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
    <circle cx="216" cy="170" r="6" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
    <circle cx="384" cy="170" r="6" fill="url(#gold)" stroke="#7a611f" stroke-width="2"/>
  </g>

  <!-- Shield outer (gold = bordure) -->
  <path d="M160 222 L440 222 L440 400 C440 500 360 560 300 590 C240 560 160 500 160 400 Z"
        fill="url(#goldband)" stroke="#7a611f" stroke-width="3"/>

  <!-- Engrailed scallops along inner edge of bordure (suggesting 'engrailed') -->
  <g fill="url(#goldband)">
    <!-- top row -->
    <circle cx="196" cy="246" r="9"/><circle cx="224" cy="246" r="9"/><circle cx="252" cy="246" r="9"/>
    <circle cx="280" cy="246" r="9"/><circle cx="308" cy="246" r="9"/><circle cx="336" cy="246" r="9"/>
    <circle cx="364" cy="246" r="9"/><circle cx="392" cy="246" r="9"/><circle cx="404" cy="246" r="9"/>
    <!-- left side -->
    <circle cx="186" cy="276" r="9"/><circle cx="186" cy="304" r="9"/><circle cx="186" cy="332" r="9"/>
    <circle cx="186" cy="360" r="9"/><circle cx="190" cy="388" r="9"/><circle cx="200" cy="416" r="9"/>
    <circle cx="216" cy="442" r="9"/><circle cx="238" cy="466" r="9"/><circle cx="262" cy="486" r="9"/>
    <!-- right side -->
    <circle cx="414" cy="276" r="9"/><circle cx="414" cy="304" r="9"/><circle cx="414" cy="332" r="9"/>
    <circle cx="414" cy="360" r="9"/><circle cx="410" cy="388" r="9"/><circle cx="400" cy="416" r="9"/>
    <circle cx="384" cy="442" r="9"/><circle cx="362" cy="466" r="9"/><circle cx="338" cy="486" r="9"/>
    <!-- toward point -->
    <circle cx="288" cy="500" r="9"/><circle cx="312" cy="500" r="9"/>
  </g>

  <!-- Shield field (gules) inset -->
  <path d="M186 248 L414 248 L414 398 C414 488 344 542 300 568 C256 542 186 488 186 398 Z"
        fill="url(#gules)" stroke="#5e1822" stroke-width="1.5"/>

  <!-- Lion rampant (gold), stylised heraldic silhouette, facing dexter (viewer's left) -->
  <g fill="url(#gold)" stroke="#6f5414" stroke-width="1.6" stroke-linejoin="round">
    <path d="M243 322
             C246 316 250 314 252 318
             C250 322 254 324 258 322
             L266 318
             C262 312 264 306 270 304
             L268 296 L276 300 L276 292 L284 298
             C292 298 298 304 298 312
             C302 318 306 322 320 330
             C338 342 350 360 356 384
             C366 374 384 348 382 318
             C381 306 376 300 370 300
             C380 296 392 302 394 318
             C397 340 388 366 366 388
             C374 398 376 416 368 436
             C362 452 350 462 342 470
             C350 478 356 494 352 512
             L360 520 L348 522 L344 512
             C338 514 330 510 330 500
             C330 486 336 476 340 466
             C330 462 318 458 304 456
             C292 454 282 446 280 436
             C268 448 256 462 248 476
             L256 484 L244 486 L242 476
             C236 478 230 472 232 464
             C235 452 245 440 258 430
             C250 424 246 414 248 404
             C238 410 226 408 220 398
             L210 402 L212 390 L222 388
             C232 388 240 392 248 396
             C250 384 256 372 266 364
             C258 356 254 344 256 334
             C252 332 248 330 246 326 Z"/>
    <circle cx="272" cy="306" r="2.6" fill="#3a2c0a" stroke="none"/>
  </g>

  <!-- Motto scroll -->
  <g>
    <path d="M96 642 C150 622 210 632 300 632 C390 632 450 622 504 642
             C470 656 470 656 504 672 C450 660 390 668 300 668
             C210 668 150 660 96 672 C130 656 130 656 96 642 Z"
          fill="#f3ecdc" stroke="#a4842f" stroke-width="2"/>
    <path d="M96 642 C84 648 84 666 96 672 L120 666 C112 660 112 654 120 648 Z"
          fill="#e3d4a8" stroke="#a4842f" stroke-width="1.5"/>
    <path d="M504 642 C516 648 516 666 504 672 L480 666 C488 660 488 654 480 648 Z"
          fill="#e3d4a8" stroke="#a4842f" stroke-width="1.5"/>
    <text x="300" y="662" text-anchor="middle" font-size="24" fill="#6f1c27"
          font-style="italic" letter-spacing="1.5">Prest d'accomplir</text>
  </g>
</svg>
